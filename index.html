    <meta name="theme-color" content="#2B1740">
    <!-- Without og:image a shared link renders as a bare text row on WhatsApp,
         Instagram and LinkedIn — which is where this site gets passed around.
         The URL must be absolute; relative paths are ignored by crawlers. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="The Growth League">
    <meta property="og:url" content="https://tgl.skykeen.in/">

    <meta property="og:image:width" content="1546">
    <meta property="og:image:height" content="902">
    <meta property="og:image:alt" content="The Growth League — Season 1, Bengaluru">
    <meta property="og:locale" content="en_IN">

    <meta name="twitter:description" content="A platform for visibility. A stage for recognition. An ecosystem for growth. Registrations open for Season 1.">
    <meta name="twitter:image" content="https://tgl.skykeen.in/logo.png">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap" rel="stylesheet">

    <!--
      Structured data, served as static HTML.

      This app is client-rendered, so the markup below is the only description
      of TGL that a crawler which does not execute JavaScript can read — which
      includes most AI search crawlers. Everything here restates facts that are
      already visible on the page; nothing is asserted that a visitor cannot
      also see. No street address is given because the venue is still marked
      "to be confirmed" on the page itself. Only the two confirmed price tiers
      are listed as offers; the final-3-slots tier is priced higher but has no
      confirmed figure, so no number is asserted for it.
    -->
    <script type="application/ld+json">

      "@graph": [

          "@type": "Organization",
