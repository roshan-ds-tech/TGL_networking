<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Square crop of the TGL mark (public/logo.png is a wide lockup with a
         caption line below it — fine for the og:image share card below, but a
         non-square icon gets squashed by the browser in a tab). -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Growth League — Season 1</title>
    <meta name="description" content="The Growth League (TGL) Season 1 — a structured business platform for emerging and growing businesses in Bengaluru. 10 categories, 400 businesses, Grand Finale 5 December 2026. Powered by SkyKeen Events.">
    <link rel="canonical" href="https://tgl.skykeen.in/">
    <meta name="theme-color" content="#2B1740">
    <!-- Without og:image a shared link renders as a bare text row on WhatsApp,
         Instagram and LinkedIn — which is where this site gets passed around.
         The URL must be absolute; relative paths are ignored by crawlers. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="The Growth League">
    <meta property="og:url" content="https://tgl.skykeen.in/">
    <meta property="og:title" content="The Growth League — Season 1">
    <meta property="og:description" content="A platform for visibility. A stage for recognition. An ecosystem for growth. Registrations open for Season 1.">
    <meta property="og:image" content="https://tgl.skykeen.in/logo.png">
    <meta property="og:image:alt" content="The Growth League — Season 1, Bengaluru">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="The Growth League — Season 1">
    <meta name="twitter:description" content="A platform for visibility. A stage for recognition. An ecosystem for growth. Registrations open for Season 1.">
    <meta name="twitter:image" content="https://tgl.skykeen.in/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap" rel="stylesheet">

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
