# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One FREE Docker web service serves the public site, the member app, the
# admin dashboard (/admin) and the API (/api) from a single origin. Data lives
# in Supabase: Postgres for records, a private Storage bucket for payment
# proofs — so no Render Postgres, no persistent disk, no workers, no cron.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Render will
# prompt for every `sync: false` value below. See DEPLOY_RENDER.md.
services:
  - type: web
    name: tgl
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Free web service: no card needed for the project's resources. It sleeps
    # after 15 idle minutes (~1 minute cold start) and has no persistent disk —
    # fine here, since all data lives in Supabase. Change to `starter` later
    # for an always-on instance; nothing else in this file depends on it.
    plan: free
    region: singapore # closest Render region to Bengaluru
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true # random value generated and stored by Render
      # Supabase -> Project Settings -> Database -> Connection string ->
      # "Session pooler" (IPv4-compatible). Include the password.
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL # https://<project-ref>.supabase.co
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY # secret — server-side only
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: payment-proofs
      # The site's public address, used in password-reset email links. May be
      # left EMPTY on first deploy: the app then uses Render's own
      # RENDER_EXTERNAL_URL (the onrender.com address). Set it to
      # https://tgl.skykeen.in once the custom domain is attached.
      - key: PUBLIC_ORIGIN
        sync: false
      - key: TRUSTED_PROXY_HOPS
        value: "1" # Render's load balancer
      - key: SESSION_HOURS
        value: "24"
      - key: RESEND_API_KEY # email codes; required in production
        sync: false
      - key: EMAIL_FROM
        value: "TGL <tgl@skykeen.in>"
